[program:factor_worker]
command=/root/miniconda3/envs/ohmyquant/bin/python3 -u factor_worker.py --poll-seconds 60
directory=/home/project/hope/Lean/data-source/tushare
user=root
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/home/project/hope/Lean/data-source/tushare/logs/factor_worker_out.log
stderr_logfile=/home/project/hope/Lean/data-source/tushare/logs/factor_worker_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
stopasgroup=true
killasgroup=true
environment=INFLUXDB_TOKEN="admin-token-leansystem",INFLUXDB_ORG="lean",INFLUXDB_BUCKET="quant",TUSHARE_DATA_PATH="/home/project/tushare-downloader/tushare_data_v2"
